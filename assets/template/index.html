<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>黑底图文 · 排版起点</title>
  <link rel="stylesheet" href="styles.css">
  <script>if(new URLSearchParams(location.search).has('render'))document.documentElement.classList.add('render-mode');</script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <header class="viewer-header">
    <h1 class="viewer-title">黑底图文<small><span data-page-count></span> 页 · 待替换的排版起点</small></h1>
    <nav class="viewer-actions" aria-label="预览与下载">
      <button id="view-toggle" type="button" aria-pressed="false">逐页看</button>
      <button id="backdrop-toggle" type="button" aria-pressed="true">隐藏背景字</button>
    </nav>
  </header>
  <main class="gallery" aria-label="文章图文">
    <!-- 下面是布局骨架；制作时替换文案，按文章增删页面和新生成的资产。 -->
    <figure class="sheet"><div class="artboard-wrap">
      <article class="page cover" data-slug="cover" data-title="文章封面" data-topic="">
        <header class="page-header"></header>
        <h2 class="cover-title">文章的标题，<br><span class="cyan">从这里开始。</span></h2>
        <p class="cover-summary">放入本篇的核心主张或引入，<br>插画与英文主题字形都需按文章调用生图模型创作。</p>
        <footer class="page-footer"></footer>
      </article>
    </div><figcaption></figcaption></figure>
    <figure class="sheet"><div class="artboard-wrap">
      <article class="page editorial" data-slug="main-idea" data-title="本页的主线" data-topic="">
        <header class="page-header"></header>
        <div class="content">
          <h2>这一页，<br><span class="cyan">只讲一件事。</span></h2>
          <div class="prose">
            <p>替换成本篇文章中的背景、经历、论据或转折。</p>
            <p>根据内容选择图文、叙事、对照或清单。<br>需要插画的页面，再放入为本篇生成的资产。</p>
          </div>
          <p class="takeaway">把本页最重要的判断，<br><span class="cyan">留在这里。</span></p>
        </div>
        <footer class="page-footer"></footer>
      </article>
    </div><figcaption></figcaption></figure>
    <figure class="sheet"><div class="artboard-wrap">
      <article class="page closing" data-slug="closing" data-title="文章结尾" data-topic="">
        <header class="page-header"></header>
        <h2 class="closing-title">留下原文的<br><span class="cyan">行动或余韵。</span></h2>
        <p class="closing-copy">结尾可以有本篇的插画或英文主题词，<br>由内容决定，不固定场景和字标。</p>
        <p class="closing-invite">放入文章真正想留给读者的那句话。</p>
        <footer class="page-footer"></footer>
      </article>
    </div><figcaption></figcaption></figure>
  </main>
</body>
</html>
